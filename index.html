:root{

*{

html,body{

body{

  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:16px;

  overflow-x:hidden;
}

/* MAIN SHELL */
.shell{
  max-width:520px;
  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}

/* HEADER */
.header{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:6px;
  background:transparent;
}

.logo{
  display:block;
  background:transparent;
  border:0;
  border-radius:0;
  box-shadow:none;
  filter:none;
}

.logo img{
  object-fit:contain;
}

/* BERU CARD */
.card{
  position:relative;

  width:100%;

  padding:20px;

  overflow:hidden;

  border-radius:22px;

  border:2px solid rgba(183,27,27,.52);

  background:
    linear-gradient(
    180deg,
    rgba(183,27,27,.13),
    rgba(183,27,27,.08));

  box-shadow:
    0 0 38px rgba(183,27,27,.42),
    0 0 78px rgba(183,27,27,.24),
    inset 0 0 22px rgba(183,27,27,.08),
    0 12px 45px rgba(0,0,0,.82);

  transition:all .35s ease;
}

.card:hover{
  transform:translateY(-3px) scale(1.01);

  box-shadow:
    0 0 54px rgba(183,27,27,.68),
    0 0 110px rgba(183,27,27,.34),
    inset 0 0 30px rgba(183,27,27,.14),
    0 14px 58px rgba(0,0,0,.9);
}

/* BERU SHADOW AURA */
.card::before{
  content:"";

  position:absolute;
  top:-50%;
  left:-50%;

  width:200%;
  height:200%;

  background:
    radial-gradient(circle,
    rgba(183,27,27,.24),
    rgba(183,27,27,.10),
    transparent 70%);

  animation:beruShadowRotate 8s linear infinite;

  filter:blur(30px);

  z-index:0;
}

/* VOID GLOW */
.card::after{
  content:"";

  position:absolute;
  inset:auto -20% -30% auto;

  width:220px;
  height:220px;

  background:
    radial-gradient(circle,
    rgba(183,27,27,.22),
    transparent 70%);

  filter:blur(42px);

  z-index:0;
}

@keyframes beruShadowRotate{
  0%{
    transform:
    translate(-50%,-50%)
    rotate(0deg);
  }

  100%{
    transform:
    translate(-50%,-50%)
    rotate(360deg);
  }
}

/* HERO */
.hero{
  display:flex;
  flex-direction:column;
  gap:16px;
  align-items:center;

  position:relative;
  z-index:1;
}


.hero-link{

}

/* CTA */
.cta{
  display:flex;
  gap:12px;
  width:100%;
  justify-content:center;
  flex-wrap:wrap;

  position:relative;
  z-index:1;
}

/* BUTTON */
.btn{
  flex:1 1 45%;

  display:inline-block;

  text-decoration:none;
  text-align:center;

  padding:15px 16px;

  border-radius:14px;

  font-weight:800;
  letter-spacing:.4px;

  color:#fff;

  background:#000000;

  position:relative;

  overflow:hidden;

  transition:all .3s ease;

  z-index:1;
}

/* BERU ROTATING BORDER */
.btn::before{
  content:"";

  position:absolute;
  top:-3px;
  left:-3px;
  right:-3px;
  bottom:-3px;

  background:
    conic-gradient(
    from 0deg,
    var(--shadow-light),
    var(--shadow-neon),
    var(--shadow-purple),
    var(--shadow-deep),
    var(--shadow-violet),
    var(--shadow-light));

  border-radius:16px;

  z-index:-2;

  animation:rotateBeruBorder 3s linear infinite;

  filter:blur(8px);
}

/* INNER */
.btn::after{
  content:"";

  position:absolute;
  inset:3px;

  background:#000000;

  border-radius:12px;

  z-index:-1;
}

.btn:hover{
  transform:translateY(-3px) scale(1.03);

  box-shadow:
    0 0 36px rgba(183,27,27,.88),
    0 0 66px rgba(183,27,27,.48),
    0 0 46px rgba(183,27,27,.36);

  animation:beruPulse 1s infinite;
}

@keyframes rotateBeruBorder{
  to{
    transform:rotate(360deg);
  }
}

@keyframes beruPulse{
  0%{
    box-shadow:
      0 0 26px rgba(183,27,27,.68);
  }

  50%{
    box-shadow:
      0 0 58px rgba(183,27,27,.95),
      0 0 88px rgba(183,27,27,.55),
      0 0 52px rgba(183,27,27,.34);
  }

  100%{
    box-shadow:
      0 0 26px rgba(183,27,27,.68);
  }
}

/* SECTION BUTTONS */
.section-buttons{
  display:flex;
  flex-direction:column;
  gap:12px;

  width:100%;

  position:relative;
  z-index:1;
}

.badge-container{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

/* BADGE */
.badge{
  flex:1 1 30%;

  display:inline-block;

  text-decoration:none;
  text-align:center; 

  padding:11px 12px;

  border-radius:12px;

  font-weight:800;
  letter-spacing:.2px;

  font-size:12px;

  color:#fff;

  background:#000000;

  position:relative;

  overflow:hidden;

  transition:all .3s ease;

  z-index:1;
}

.badge::before{
  content:"";

  position:absolute; 
  top:-3px;
  left:-3px;
  right:-3px;
  bottom:-3px;

  background:
    conic-gradient(
    from 0deg,
    #b71b1b,
    #b71b1b,
    #b71b1b,
    #b71b1b,
    #b71b1b,
    #b71b1b);

  border-radius:14px;

  z-index:-2;

  animation:rotateBeruBorder 4s linear infinite;

  filter:blur(8px);
} 

.badge::after{
  content:"";

  position:absolute;
  inset:3px;

  background:#000000;

  border-radius:10px;

  z-index:-1;
}

.badge:hover{
  transform:scale(1.06);

  box-shadow:
    0 0 32px rgba(183,27,27,.82),
    0 0 60px rgba(183,27,27,.45),
    0 0 40px rgba(183,27,27,.34);

/* CLICKABLE GIF BOX */
.gif-box{

.gif-link:hover{

</style>
